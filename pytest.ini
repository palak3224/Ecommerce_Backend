[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ; Intentional: app forces null cache so Redis is not required (see app.py / audit).
    ignore:.*CACHE_TYPE is set to null.*:UserWarning
    ; Upstream flask_caching deprecation until the project pins a newer pattern.
    ignore:Using the initialization functions in flask_caching.backend is deprecated:DeprecationWarning:flask_caching
